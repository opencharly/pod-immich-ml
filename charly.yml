pod-immich-ml:
    candy:
        description: |-
            Retired candy — this repo ships no Immich machine-learning backend any more.
            The `immich-ml` candy (its `require:` on pod-immich, its MACHINE_LEARNING_* env,
            the 3003 port, the models volume, the supervised immich-ml service and its
            check: steps), its two `skill:` entities and both `.agents/skills/` files are
            deleted: Immich v3.4.1 carries the ML backend in-process in the ONE `immich`
            image owned by opencharly/pod-immich (supervised `immich-ml` on port 3003, CUDA
            on the CachyOS GPU base), so a separate image has nothing left to install.
            Tracking issue: opencharly/pod-immich#12.
            What remains is this documentation-only no-op, so the repo still validates as a
            project while its retirement awaits the operator (opencharly/opencharly#600).
            Nothing is authored, built, deployed or consumed here.
        plan:
            - run: this documentation-only candy ships no install content (it records the immich-ml candy's retirement); validate-satisfying no-op
              command: "true"
              context:
                - build
            - check: no-op — the immich-ml candy, its service, port, volume and both skill nodes are deleted; the ML backend is part of the single immich image in opencharly/pod-immich (opencharly/pod-immich#12)
              id: pod-immich-ml-retired
              context:
                - build
              command: "true"
